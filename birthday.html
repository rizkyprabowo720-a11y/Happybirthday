<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selamat Ulang Tahun!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="birthday">
  <canvas id="confetti"></canvas>
  <div class="flowers" id="flowers"></div>

  <main class="container">
    <p class="subtitle">🎉 Hari Yang Spesial 🎉</p>
    <h1>Selamat Ulang Tahun,<br><span class="nama"></span>!</h1>

    <div class="cake" id="cake">
      <div class="candles">
        <div class="candle"><span class="flame"></span></div>
        <div class="candle"><span class="flame"></span></div>
        <div class="candle"><span class="flame"></span></div>
      </div>
      <div class="layer layer-top"></div>
      <div class="layer layer-middle"></div>
      <div class="layer layer-bottom"></div>
      <div class="plate"></div>
    </div>

    <p class="wish" id="wish">Buat permohonan, lalu tiup lilinnya! 🕯️</p>

    <div class="buttons">
      <button id="blowBtn">🌬️ Tiup Lilin</button>
      <button id="relightBtn" class="secondary" hidden>🔥 Nyalakan Lagi</button>
      <button id="confettiBtn" class="secondary">🎊 Hujan Konfeti</button>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="flowers.js"></script>
  <script src="script.js"></script>
</body>
</html>
